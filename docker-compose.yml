services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 20
  adminer:
    image: adminer:latest
    container_name: rag-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OMP_NUM_THREADS=6
      - OPENBLAS_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - OLLAMA_KEEP_ALIVE=5m
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ollama-pull:
    image: ollama/ollama:latest
    container_name: rag-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Verificando modelos necessários..."
        
        # Baixar modelo de chat
        if ollama list | grep -q "qwen2.5:3b"; then
          echo "Modelo qwen2.5:3b já baixado!"
        else
          echo "Baixando modelo qwen2.5:3b..."
          ollama pull qwen2.5:3b
          echo "Modelo qwen2.5:3b baixado com sucesso!"
        fi
        
        # Baixar modelo de embedding
        if ollama list | grep -q "mxbai-embed-large"; then
          echo "Modelo mxbai-embed-large já baixado!"
        else
          echo "Baixando modelo mxbai-embed-large..."
          ollama pull mxbai-embed-large
          echo "Modelo mxbai-embed-large baixado com sucesso!"
        fi
        
        echo "Todos os modelos estão prontos!"
    restart: "no"

  rag-api:
    build:
      context: .
      dockerfile: src/Rag.Api/Dockerfile
    container_name: rag-api
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=ragdb
      - Jwt__SecretKey=${JWT_SECRET}
      - Ollama__BaseUrl=http://ollama:11434
      # Se estiver usando Nginx na frente em https://localhost:
      - Cors__AllowedOrigins__0=https://localhost
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  rag-app:
    build:
      context: .
      dockerfile: src/Rag.App/Dockerfile
    container_name: rag-app
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - Api__BaseUrl=http://rag-api:8081
    depends_on:
      rag-api:
        condition: service_started
      
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    depends_on:
      - rag-app
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
  loki:
    image: grafana/loki:2.9.3
    container_name: rag-loki
    command: -config.file=/etc/loki/config/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
  promtail:
    image: grafana/promtail:2.9.3
    container_name: rag-promtail
    command: -config.file=/etc/promtail/config/promtail-config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config/promtail-config.yml:ro
    depends_on:
      - loki
  tempo:
    image: grafana/tempo:2.5.0
    container_name: rag-tempo
    command: [ "-config.file=/etc/tempo/config.yml" ]
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: rag-nginx
    depends_on:
      rag-app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
volumes:
  pgdata:
  ollama_models:
  prom_data:
  grafana_data:
  loki_data:
  tempo_data:
  aspnet_keys: